syntax = "proto3";

// PLACEHOLDER proto — proves the codegen → transport → hooks pipeline.
// Replace this file with the real service definition, then run `npm run gen`.
package helicopter.v1;

message LatLng {
  double lat = 1;
  double lng = 2;
}

message Waypoint {
  string id = 1;
  string name = 2;
  LatLng position = 3;
  int32 altitude_ft = 4;
}

message Route {
  string id = 1;
  string name = 2;
  repeated Waypoint waypoints = 3;
  double distance_nm = 4;
  int32 duration_min = 5;
}

message ListRoutesRequest {
  string region = 1;
}

message ListRoutesResponse {
  repeated Route routes = 1;
}

message CreateRouteRequest {
  Route route = 1;
}

message CreateRouteResponse {
  Route route = 1;
}

// Fetch and write, so both a query and a mutation exist to wire up.
service RouteService {
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc CreateRoute(CreateRouteRequest) returns (CreateRouteResponse);
}
